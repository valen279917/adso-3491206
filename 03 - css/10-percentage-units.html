<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Percentage Units</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        main {
            width: 100%;
            section.percentage {
                margin: 0 auto;
                width: 80%;
                div.parent {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    div {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 50vh;
                        font-size: 3rem;
                        &.child1 {
                            background-color: palegreen;
                            width: 70%;  
                        }
                        &.child2 {
                            background-color: darkorchid;
                            width: 30%;
                    }
                }
            }
        }
    }
    </style>
    </head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>

    <main>
        <header class="mainmenu internal">
        <h1>10-Percentage Units</h1>
        <img src="../src/imgs/logo-css.png" alt="css">
        <h3>Are relative to the size of the parent element.</h3>
        </header>
        <section class="percentage">
          <h2 class="subtitle">Example:</h2>
            <div class="parent">
                <div class="child1">70%</div>
                <div class="child2">30%</div>
            </div>
