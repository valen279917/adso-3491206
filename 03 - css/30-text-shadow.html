<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 - text - shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        p.txt {
            text-align: center;
            font-size: 3.6rem;

              &.txt1 {
                    text-shadow: 0px 0px 16px white ;
                }
                &.txt2 {
                    text-shadow: -8px -8px 8px white;
                }

                &.txt3 {
                    font-weight: 900;
                    text-shadow:     0 1px 0 hsl(174,5%,80%),
	                 0 2px 0 hsl(174,5%,75%),
	                 0 3px 0 hsl(174,5%,70%),
	                 0 4px 0 hsl(174,5%,66%),
	                 0 5px 0 hsl(174,5%,64%),
	                 0 6px 0 hsl(174,5%,62%),
	                 0 7px 0 hsl(174,5%,61%),
	                 0 8px 0 hsl(174,5%,60%),
	
	                 0 0 5px rgba(0,0,0,.05),
	                0 1px 3px rgba(0,0,0,.2),
	                0 3px 5px rgba(0,0,0,.2),
	               0 5px 10px rgba(0,0,0,.2),
	              0 10px 10px rgba(0,0,0,.2),
	              0 20px 20px rgba(0,0,0,.3);
                }
                &.txt4 {
                    font-weight: 900;
                    text-shadow:0 1px 0 hsl(58, 88%, 49%),
	                 0 2px 0 hsl(58, 88%, 48%),
	                 0 3px 0 hsl(58,88%,49%),
	                 0 4px 0 hsl(60,7%,92%),
	                 0 5px 0 hsl(60, 7%, 92%),
	                 0 6px 0 hsl(58,88%,49%),
	                 0 7px 0 hsl(58,88%,49%),
	                 0 8px 0 hsl(58,88%,49%),
	
	                 0 0 5px rgba(9, 222, 9, 2),
	                0 1px 3px rgba(9,222,9,.2),
	                0 3px 5px rgba(9,222,2,.2),
	               0 5px 10px rgba(9,222,9,.2),
	              0 10px 10px rgba(9,222,9,.2),
	              0 20px 20px rgba(9,222,9,.3);
                }
            }

    </style>
    </head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
        <h1>30 - text - shadow</h1>
        <img src="../src/imgs/logo-css.png" alt="css">
        <h3>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.  </h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
        </menu>
    </main>
</body>
</html>
