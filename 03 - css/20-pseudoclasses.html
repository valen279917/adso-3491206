<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-pse</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        /*:link|:hover|:active|:visited*/
        menu.options  {
            a:link {
                color: #0009;
                background-color: #fff9;
                padding: 0.4rem 0.8rem;
            }
            a:hover {
                color: #fff9;
                background-color: #663399;
            }
            a:active {
                color: #fff9;
                background-color: #dc143c;
            }
            a:first-child {
               opacity: 0.5
                pointer-events: none;
            }
            /* :focus, :blur*/
            input {
                padding: 0.4rem 0.8rem;
                margin-top: 0.4rem 0;
                &:focus {
                    background-color: #663399;
                    color: #fff9;
                }
            }
            /*:first-letter|:first-line*/
            p.paragraph {
                &:first-letter {
                    font-size: 4rem;
                }
                &:first-line {
                    background-color: #663399;
                }
            }
         }
         div.heart {
            position: relative; 
            height: 100px;
            &:after, &:before {
                position: absolute;
                content: "";
                left: 130px;
                top: 0;
                background-color: #dc143c;
                border-radius: 25px 25px 0 0;
                height: 80px;
                width: 50px;
            }
            &::before {
                transform: rotate(-45deg);
            }
            &::after {
                left: 152px;
                transform: rotate(45deg);
            }
         }
    </style>
    </head>
<body class="css">

        </a>
    </nav>

            <h3>Is used to define a special state of an element.</h3>
        </header>
        <section>
            <h2 class="subtitle">:link|:hover|:active|:visited</h2>
            <h4>:first-child|:last-child</h4>
            <menu class="options">
                <a href="#">Option 1</a>
                <a href="#">Option 2</a>
                <a href="#">Option 3</a>
            </menu>
            <h2 class="subtitle">:focus |:blur</h2>
            <input type="text" placeholder="Enter your First Name">
            <br>
            <input type="text" placeholder="Enter your Last Name">
            <h2 class="subtitle">:first-letter|:first-line</h2>
            <p class="paragraph">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Laboriosam est fugit omnis.
            </p>
            <h2 class="subtitle">:before|:after</h2>
            <div class="heart"></div>
        </section>
        </menu>
    </main>
